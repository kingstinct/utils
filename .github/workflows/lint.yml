# This is a basic workflow to help you get started with Actions

name: Lint

on:
  workflow_dispatch:
    inputs:
      lint_command:
        required: false
        type: string
        default: pnpm lint-only
        description: The command for running lint
      package_manager:
        required: false
        type: string
        default: pnpm
        description: The package manager to use
      pnpm_version:
        required: false
        type: string
        description: If using pnpm - which version to use (defaults to the packageManager field in package.json)
  workflow_call:
    inputs:
      lint_command:
        required: false
        type: string
        default: pnpm lint-only
      package_manager:
        required: false
        type: string
        default: pnpm
        description: The package manager to use
      pnpm_version:
        required: false
        type: string
        description: If using pnpm - which version to use (defaults to the packageManager field in package.json)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.package_manager == 'pnpm' }}
        with:
          version: ${{ inputs.pnpm_version }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ env.ACT }}
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ !env.ACT }}
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies (bun)
        run: ${{ inputs.package_manager }} install --frozen-lockfile --concurrent-scripts 1
        if: ${{ inputs.package_manager == 'bun' }}
        working-directory: ${{ inputs.working_directory }}

      - name: Install dependencies (npm)
        run: npm ci
        if: ${{ inputs.package_manager == 'npm' }}
        working-directory: ${{ inputs.working_directory }}

      - name: Install dependencies (others)
        run: ${{ inputs.package_manager }} install --frozen-lockfile
        if: ${{ inputs.package_manager != 'npm' && inputs.package_manager != 'bun' }}
        working-directory: ${{ inputs.working_directory }}

      - name: Lint
        run: ${{ inputs.lint_command }}
